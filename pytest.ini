[pytest]
testpaths = src tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --tb=short
    --strict-markers
    -m "not slow"
    --disable-warnings

markers =
    tracing: tests for execution tracing functionality
    patterns: tests for bug pattern detection
    verification: tests for formal verification
    generation: tests for test generation
    performance: performance/benchmark tests
    slow: slow tests (deselect with '-m "not slow"')
    integration: integration tests combining multiple features
    contract: tests for contract verification

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
