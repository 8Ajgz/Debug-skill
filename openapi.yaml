openapi: 3.0.0
info:
  title: Verification-Debugging-Suite API
  version: 1.2.0
  description: Unified verification and debugging orchestrator with formal verification, runtime debugging, test generation, and problem diagnosis
  contact:
    name: API Support
    url: https://github.com/user/verification-debugging-suite
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.verification-debugging-suite.local/v1
    description: Local API endpoint

paths:
  /master-debugger/debug:
    post:
      operationId: master_debugger_v5_debug
      tags:
        - Master-Debugger-v5
      summary: Execute 4-phase automated debugging
      description: Run complete debugging workflow with automatic phase selection based on risk level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: Python code to debug
                  example: "def divide(a, b):\n    return a / b"
      responses:
        '200':
          description: Successful debug operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedReport'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'
        '500':
          description: Execution error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationError'

  /master-debugger/classify-risk:
    post:
      operationId: master_debugger_v5_classify_risk
      tags:
        - Master-Debugger-v5
      summary: Classify code risk level
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Risk classification
          content:
            application/json:
              schema:
                type: object
                properties:
                  level:
                    type: string
                    enum: [CRITICAL, HIGH, MEDIUM]

  /python-debug/execute:
    post:
      operationId: python_debug_execute_with_debug
      tags:
        - Python-Debug
      summary: Execute code with full tracing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                max_timeline_events:
                  type: integer
                  default: 10000
      responses:
        '200':
          description: Execution trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebugReport'

  /python-debug/detect-patterns:
    post:
      operationId: python_debug_detect_patterns
      tags:
        - Python-Debug
      summary: Detect bug patterns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - debug_report
              properties:
                debug_report:
                  type: object
      responses:
        '200':
          description: Detected patterns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BugPatternResult'

  /pyprover/verify:
    post:
      operationId: pyprover_verify_contract
      tags:
        - PyProver
      summary: Verify formal contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                language:
                  type: string
                  default: python
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'

  /test-generator/generate:
    post:
      operationId: test_generator_generate
      tags:
        - Test-Generator
      summary: Generate test suite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                language:
                  type: string
                  default: python
      responses:
        '200':
          description: Generated tests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSuite'

  /code-orchestrator/analyze:
    post:
      operationId: code_orchestrator_analyze
      tags:
        - Code-Orchestrator
      summary: Analyze codebase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_path
              properties:
                project_path:
                  type: string
      responses:
        '200':
          description: Code analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeAnalysis'

  /code-orchestrator/analyze-github:
    post:
      operationId: code_orchestrator_analyze_github
      tags:
        - Code-Orchestrator
      summary: Analyze GitHub repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - repo_url
              properties:
                repo_url:
                  type: string
      responses:
        '200':
          description: GitHub analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeAnalysis'

  /code-orchestrator/decompose:
    post:
      operationId: code_orchestrator_decompose
      tags:
        - Code-Orchestrator
      summary: Create verification plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code_analysis
              properties:
                code_analysis:
                  type: object
      responses:
        '200':
          description: Verification plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationPlan'

  /troubleshooting/diagnose:
    post:
      operationId: troubleshooting_diagnose
      tags:
        - Troubleshooting
      summary: Diagnose problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - problem
              properties:
                problem:
                  type: string
                context:
                  type: string
                  default: code
      responses:
        '200':
          description: Diagnosis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisResult'

components:
  schemas:
    UnifiedReport:
      type: object
      properties:
        risk_level:
          type: string
          enum: [CRITICAL, HIGH, MEDIUM]
        phases_executed:
          type: array
          items:
            type: integer
        total_issues:
          type: integer
        confidence_score:
          type: number
          minimum: 0
          maximum: 1
        summary:
          type: string

    DebugReport:
      type: object
      properties:
        timeline:
          type: array
          items:
            type: object
        final_state:
          type: object
        execution_time_ms:
          type: number

    BugPatternResult:
      type: object
      properties:
        patterns:
          type: array
          items:
            type: object
            properties:
              pattern_type:
                type: string
              severity:
                type: string
              location:
                type: string

    VerificationResult:
      type: object
      properties:
        verified:
          type: boolean
        details:
          type: string
        counterexample:
          type: [string, 'null']

    TestSuite:
      type: object
      properties:
        test_cases:
          type: array
          items:
            type: object
        coverage_percent:
          type: number
        mutation_score:
          type: number

    CodeAnalysis:
      type: object
      properties:
        functions:
          type: array
        dependencies:
          type: array
        file_count:
          type: integer

    VerificationPlan:
      type: object
      properties:
        functions_to_verify:
          type: array
        estimated_tokens:
          type: integer
        estimated_hours:
          type: number

    DiagnosisResult:
      type: object
      properties:
        classified_stage:
          type: string
        possible_causes:
          type: array
          items:
            type: string
        remediation_steps:
          type: array
          items:
            type: string
        verification_passed:
          type: boolean

    OperationError:
      type: object
      properties:
        error_type:
          type: string
          enum: [INVALID_INPUT, EXECUTION_FAILED, TIMEOUT, DEPENDENCY_MISSING, PERMISSION_DENIED]
        message:
          type: string
        details:
          type: object

tags:
  - name: Master-Debugger-v5
    description: 4-phase orchestrator
  - name: Python-Debug
    description: Runtime tracing
  - name: PyProver
    description: Formal verification
  - name: Test-Generator
    description: Test generation
  - name: Code-Orchestrator
    description: Codebase analysis
  - name: Troubleshooting
    description: Problem diagnosis
